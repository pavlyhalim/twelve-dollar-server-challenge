# Box-shaped load test of c-iouring-pavlyhalim on a GitHub runner: the server alone in a 1 vCPU /
# 2 GiB KVM guest (Ubuntu 24.04, kernel 6.8), the load generator on the runner. Fork-only branch;
# not part of any pull request.
name: load test
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "build:users runs, a list is tried top down until one passes (M = merged #245 as scored, P = this branch)"
        default: "P:340000,320000,300000,280000,260000 M:280000"
      box_us:
        description: "the box's CPU per request in us, to slow the guest to its speed (empty: no throttle)"
        default: ""
      cpu:
        description: "CPU model the runner must have, e.g. 9V74 (empty: any fast one)"
        default: ""
      profile:
        description: "seconds into each run to take a 30 s perf profile and TCP counters (empty: none)"
        default: ""
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: seed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 && bash seed/make-seed.sh
      - name: load test
        env:
          BOX_US: ${{ github.event.inputs.box_us }}
          PROFILE: ${{ github.event.inputs.profile }}
          REQUIRE_CPU: ${{ github.event.inputs.cpu }}
        run: bash loadtest/run.sh "${{ github.event.inputs.runs }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-logs
          path: /tmp/lt/logs
